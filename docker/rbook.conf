<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # Allow .htaccess files to override — required for mod_rewrite dispatch
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    # Serve Smarty compile cache and skin images directly without PHP
    <Directory /var/www/html/skins>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/rbook_error.log
    CustomLog ${APACHE_LOG_DIR}/rbook_access.log combined
</VirtualHost>
