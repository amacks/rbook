<VirtualHost *:80>
    DocumentRoot /var/www/html

    Alias /rbook /var/www/html/rbook
    <Directory /var/www/html/rbook>
        # Allow .htaccess files to override — required for mod_rewrite dispatch
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    ##block the install now that we are installed
    <Directory /var/www/html/rbook/install>
        Order Deny,Allow
        Deny from all
    </Directory>

    # Serve Smarty compile cache and skin images directly without PHP
    <Directory /var/www/html/rbook/skins>
        <FilesMatch "\.tpl$">
            Require all denied
        </FilesMatch>
        AllowOverride None
        Require all granted
    </Directory>

    ## user uploaded images
    <Directory /var/www/html/rbook/img>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/rbook_error.log
    CustomLog ${APACHE_LOG_DIR}/rbook_access.log combined
</VirtualHost>
