<VirtualHost *:80>
    DocumentRoot /var/www/html/

    ## content to appear at /rbook
    Alias /rbook /var/www/html/rbook
    <Directory /var/www/html/rbook>
        # Allow .htaccess files to override — required for mod_rewrite dispatch
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    # Serve Smarty compile cache and skin images directly without PHP
    <Directory /var/www/html/rbook/skins>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/rbook_error.log
    CustomLog ${APACHE_LOG_DIR}/rbook_access.log combined
</VirtualHost>
